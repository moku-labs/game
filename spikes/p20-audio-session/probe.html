<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P20 audio session probe</title>
<style>
  body { font: 16px system-ui; margin: 16px; background: #fff; color: #000; }
  button { font-size: 18px; margin: 4px 0; padding: 12px; width: 100%; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Device check for P20. Play Spotify first, flip the silent switch, then tap. Write down what you hear. -->
<button data-type="auto">type = auto, play Web Audio tone</button>
<button data-type="ambient">type = ambient, play Web Audio tone</button>
<button data-type="playback">type = playback, play Web Audio tone</button>
<button id="element">type = auto, play an &lt;audio&gt; element (data URI tone)</button>
<pre id="out"></pre>
<script>
  const out = document.getElementById("out");
  const say = text => { out.textContent += text + "\n"; };
  const session = navigator.audioSession;

  say("navigator.audioSession: " + (session ? "present" : "missing"));
  if (session) say("type at load: " + session.type + ", state: " + session.state);

  let context;

  function tone() {
    context ??= new AudioContext();
    context.resume();
    const osc = context.createOscillator();
    osc.connect(context.destination);
    osc.start();
    osc.stop(context.currentTime + 1);
    say("context.state: " + context.state + (session ? ", session.type: " + session.type : ""));
  }

  for (const button of document.querySelectorAll("button[data-type]")) {
    button.addEventListener("click", () => {
      if (session) session.type = button.dataset.type;
      tone();
    });
  }

  // A one-second 440 Hz WAV built in memory, so the page has no files.
  function wavUri() {
    const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, "data"); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128 + 60 * Math.sin(2 * Math.PI * 440 * i / rate));
    let s = ""; new Uint8Array(buf).forEach(b => { s += String.fromCharCode(b); });
    return "data:audio/wav;base64," + btoa(s);
  }

  document.getElementById("element").addEventListener("click", () => {
    if (session) session.type = "auto";
    new Audio(wavUri()).play().then(() => say("<audio> playing"), e => say("<audio> failed: " + e.name));
  });
</script>
</body>
</html>
