<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>p12 text input spike (resize)</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#141821;color:#dde;font:12px ui-monospace,monospace;overscroll-behavior:none}
      #stage{position:fixed;inset:0;width:100%;height:100%;display:block}
      #hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top);padding:4px 8px;white-space:pre-wrap;pointer-events:none;color:#9fe;background:rgba(0,0,0,.45);font-size:9px;line-height:1.2;max-height:22vh;overflow:hidden;z-index:2}
      #safe{position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden}
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="safe"></div>
    <form id="form" action="#"><input id="field" /></form>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
